<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina — студия сайтов с ИИ</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var dead = {
          'llama-3.3-70b-versatile': 1,
          'llama-3.1-8b-instant': 1,
          'llama3-70b-8192': 1,
          'llama3-8b-8192': 1,
          'qwen/qwen3-32b': 1,
          'moonshotai/kimi-k2-instruct-0905': 1,
          'moonshotai/kimi-k2-instruct': 1,
          'meta-llama/llama-4-scout-17b-16e-instruct': 1,
          'meta-llama/llama-4-maverick-17b-128e-instruct': 1,
        }
        try {
          var key = 'lumina.settings.v1'
          var s = JSON.parse(localStorage.getItem(key) || '{}')
          var changed = false
          if (!s.model || dead[s.model]) {
            s.model = 'openai/gpt-oss-120b'
            changed = true
          }
          if (s.customModel && dead[s.customModel]) {
            s.customModel = ''
            changed = true
          }
          if (changed) localStorage.setItem(key, JSON.stringify(s))
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=syne:700,800|manrope:400,500,600,700|jetbrains-mono:400,500"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
